services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      FACET_BATCH_SIZE: 8
      FACET_PROCESS_BATCH_SIZE: 30
      FACET_MAX_CATEGORIES: 12
      OLLAMA_TIMEOUT_SECONDS: 300
      OLLAMA_NUM_CTX: 4096
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
