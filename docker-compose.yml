services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      FACET_BATCH_SIZE: 16
      FACET_PROCESS_BATCH_SIZE: 64
      FACET_MAX_CATEGORIES: 12
      OLLAMA_TIMEOUT_SECONDS: 1200
      OLLAMA_NUM_CTX: 4096
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 1h
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
